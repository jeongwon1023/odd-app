name: odd_app
description: ODD - AI Date Planner (전국 서비스)
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 네이버 지도 (네이티브 SDK — WebView origin 인증 벽 우회)
  # 1.4+에서 초기화 API가 바뀔 수 있어 clientId API가 안정적인 1.3.x로 고정
  flutter_naver_map: '>=1.3.0 <1.4.0'

  # Gemini AI
  google_generative_ai: ^0.4.6

  # Location
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  # Network
  http: ^1.2.1
  cached_network_image: ^3.3.1

  # WebView (네이버 지도 JS API)
  webview_flutter: ^4.10.0

  # External links (블로그 원문 링크)
  url_launcher: ^6.3.1

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  shared_preferences: ^2.4.0   # Built-in Kotlin 지원 (KGP 경고 해결)

  # 공유
  share_plus: ^11.0.0          # Built-in Kotlin 지원 (KGP 경고 해결)

  # 이미지 캡처·저장
  path_provider: ^2.1.4

  # ── Supabase (백엔드 · Auth · Realtime · Storage) ──
  supabase_flutter: ^2.15.0

flutter:
  uses-material-design: true
  assets:
    - assets/category_images.json

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
