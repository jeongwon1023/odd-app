name: odd_app
description: ODD - AI Date Planner (전국 서비스)
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 네이버 지도
  flutter_naver_map: ^1.3.0

  # Gemini AI
  google_generative_ai: ^0.4.6

  # Location
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  # Network
  http: ^1.2.1
  cached_network_image: ^3.3.1

  # UI
  shimmer: ^3.0.0
  shared_preferences: ^2.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/category_images.json

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
